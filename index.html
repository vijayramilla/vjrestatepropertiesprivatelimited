<!doctype html>
<html lang="en">
<!-- Cloudflare Pages auto-deploy -->
<head>
  <meta charset="UTF-8" />

  <!-- Preconnect only to services used during first paint / first data fetch.
       Fonts are self-hosted (@fontsource) — no Google Fonts connections.
       Maps SDK is deferred (loaded on demand), so no maps.googleapis.com.
       Stale preconnects waste up to ~150ms of connection setup per origin. -->
  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <link rel="preconnect" href="https://storage.googleapis.com" />
  <!-- Property images live on Supabase Storage (Smart CDN) — warm the
       connection before JS hydrates so the first card image skips DNS+TLS. -->
  <link rel="preconnect" href="https://eimvaxrmiizdlgonhiov.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://eimvaxrmiizdlgonhiov.supabase.co" />
  <link rel="dns-prefetch" href="https://firebaseapp.com" />
  <link rel="dns-prefetch" href="https://maps.googleapis.com" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Theme color for mobile browser -->
  <meta name="theme-color" content="#0A1628" />
  <meta name="application-name" content="VJR Estate" />
  <meta name="apple-mobile-web-app-title" content="VJR Estate" />

  <!-- All fonts (Aileron, Poppins, Instrument Serif, Inter) are self-hosted
       via @fontsource and bundled — zero external font requests, no
       render-blocking stylesheets, no FOIT on slow connections. -->

  <link rel="canonical" href="https://vjrestate.com/" />

  <!-- SEO Meta tags -->
  <title>VJR Estate | Buy Rental Income Properties in Bangalore — PG Buildings & Commercial Assets</title>
  <meta name="description" content="VJR Estate is Bangalore's only dedicated rental income property platform. Buy curated PG buildings, residential rental blocks and commercial income properties with monthly income data. Rental income specialists for Bangalore." />

  <!-- Open Graph for WhatsApp/social sharing -->
  <meta property="og:site_name" content="VJR Estate" />
  <meta property="og:url" content="https://vjrestate.com/" />
  <meta property="og:title" content="VJR Estate | Buy Rental Income Properties in Bangalore — PG Buildings & Commercial Assets" />
  <meta property="og:description" content="VJR Estate is Bangalore's only dedicated rental income property platform. Buy curated PG buildings and rental income properties with monthly income data." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://vjrestate.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="VJR Estate — Rental Income Properties in Bangalore" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VJR Estate | Buy Rental Income Properties in Bangalore" />
  <meta name="twitter:description" content="Buy curated PG buildings and rental income properties in Bangalore. Bangalore's dedicated rental income property specialists." />
  <meta name="twitter:image" content="https://vjrestate.com/og-image.png" />

  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
